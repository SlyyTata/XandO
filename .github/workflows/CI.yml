name: node.js application CI $ CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    

jobs:
  # Test stage for syntax and unit tests
  Test:
    # Start of the unit testing stage where the source code is made available and 
    #test for syntax errors
    name: Test the code
    runs-on: ubuntu-latest

    steps:
      #put the code in the runner
    - name: Copy the code to the runner
      uses: actions/checkout@v4
      
    - name: Setup Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x

    - name: Install dependencies
      run: npm install

    - name: Test the code
      run: npm test

  # Static code analysis stage for linting the code
  Lint:
    # Start of the Static code Analysis stage where the source code is made available and 
    #test for bugs and functionality issues
    needs: [Test]
    name: Lint the code
    runs-on: ubuntu-latest

    steps:
      - name: copy the source code over
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
        
      - name: Install dependencies
        run: npm install

      - name: Linting the code
        run: npm run lint

  # Security scan stage for scanning the code for vulnerabilities
  Scan:
    # Start of the Security scan stage where the source code is made available and 
    # the code is scanned for vulnerabilities
    needs: [ Test, Lint ]
    name: Scan the code
    runs-on: ubuntu-latest

    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      # This action will invoke setup-trivy and install trivy
      - name: Generate Trivy Vulnerability Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          output: trivy-fs-report.json
          format: table
          scan-ref: .
          exit-code: 0

  
  Build_Tag_Push_With_Docker:
    # Start of the Build stage where the source code is made available and 
    #the code is built on the runner
    name: Build and Tag with Docker
    runs-on: ubuntu-latest

    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_TOK }}

      - name: Docker Buildx Setup
        uses: docker/setup-buildx-action@v3

      - name: Build and Tag Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_NAME }}/${{ secrets.DOCKER_PROJECT }}:${{ github.sha }}
            ${{ secrets.DOCKER_NAME }}/${{ secrets.DOCKER_PROJECT }}:latest
      
  # Image scan stage for scanning the Docker image for vulnerabilities
  Scan_Docker_Image:
    # Start of the Image scan stage where the Docker image is made available and 
    # the image is scanned for vulnerabilities
    needs: [Build_Tag_Push_With_Docker]
    name: Scan the Docker image
    runs-on: ubuntu-latest

    steps:
      - name: checkout the code
        uses: actions/checkout@v4

      # This action will invoke setup-trivy and install trivy
      - name: Generate Trivy Vulnerability Report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_NAME }}/${{ secrets.DOCKER_PROJECT }}:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Start of the deployment stage where the Docker image is deployed to the amazon ECS cluster
  Deploy:
    needs: [Scan_Docker_Image]
    name: Deploy the Docker image to Amazon ECS
    runs-on: ubuntu-latest

    steps:
      - name: checkout the code
        uses: actions/checkout@v4

        # Login into the AWS account using the OpenID connect
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      #I got this code form google and iv read to understand what it does
      - name: Download Existing Task Definition from AWS
        run: aws ecs describe-task-definition --task-definition ${{ secrets.ECS_TASK_FAMILY }} --query taskDefinition > task-definition.json

      - name: Inject New Image Tag into Task Definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.ECS_CONTAINER_NAME }}
          image: ${{ secrets.DOCKER_NAME }}/${{ secrets.DOCKER_PROJECT }}:${{ github.sha }}

      - name: Trigger Rolling Update on Existing ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE_NAME }}
          cluster: ${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true            # Until service is stable.
          
